name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "QRViewer" --collect-all PySide6 run.py

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist\\QRViewer.exe" "out\\QRViewer.exe" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRViewer-windows-exe
          path: out/QRViewer.exe

      - name: Upload to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/QRViewer.exe
